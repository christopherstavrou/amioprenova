name: Scrape Facebook Events

on:
  # Run manually from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which events to scrape'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - upcoming
          - past

  # Automatically every Monday at 08:00 UTC
  schedule:
    - cron: '0 8 * * 1'

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          # Persist a PAT (not the default GITHUB_TOKEN) so the PR opened below
          # triggers the required CI workflows. PRs opened with GITHUB_TOKEN do
          # NOT trigger other workflows, which would leave required checks
          # unreported and the PR permanently blocked. Fine-grained PAT scoped to
          # this repo with contents:write + pull-requests:write, stored as the
          # SCRAPE_TOKEN secret. Falls back to GITHUB_TOKEN if unset (CI won't
          # run on the PR in that case — see required checks on develop).
          token: ${{ secrets.SCRAPE_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # @christopherstavrou/* deps come from private GitHub Packages — needs a
      # PAT with read:packages stored as the NODE_AUTH_TOKEN repo secret.
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Determine scrape flags
        id: flags
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          if [ "$MODE" = "upcoming" ]; then
            echo "flags=--upcoming" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = "past" ]; then
            echo "flags=--past" >> "$GITHUB_OUTPUT"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run scraper
        run: >
          npx sitekit-scrape-events
          --page-url 'https://www.facebook.com/amioprenovamusic/events'
          --out-dir src/content/shows
          --images-dir public/images/events
          --cookies scripts/facebook-cookies.json
          ${{ steps.flags.outputs.flags }}

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- src/content/shows/ public/images/events/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # develop is branch-protected (PR required, enforced for admins), so the
      # bot cannot push directly. Open a PR from a bot branch instead; a human
      # reviews + merges the event-data diff. (Enable auto-merge here if you'd
      # rather it land unattended.)
      # The PR is opened with SCRAPE_TOKEN (a PAT) so it triggers the required CI
      # checks on develop — the quality gate skips bot/* PRs, CodeQL + the
      # Cloudflare build run and gate the merge like any other PR.
      - name: Open a PR with the changes if any
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SCRAPE_TOKEN || github.token }}
        run: |
          BRANCH="bot/scrape-events-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/content/shows/ public/images/events/
          git commit -m "chore(events): sync Facebook events"
          git push origin "$BRANCH"
          gh pr create --base develop --head "$BRANCH" \
            --title "chore(events): sync Facebook events" \
            --body "Automated weekly Facebook events sync via @christopherstavrou/events-scraper. Review the event-data diff and merge."
