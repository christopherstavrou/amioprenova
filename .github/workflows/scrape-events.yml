name: Scrape Facebook Events

on:
  # Run manually from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which events to scrape'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - upcoming
          - past

  # Weekly auto-run. The original clobbering bug is fixed: the scraper honors
  # `_overrides` locks (events-scraper 0.2.1) and curated events now lock
  # title/hosts/startDate/timezone, so scrapes can't revert human content.
  # Verified end-to-end via workflow_dispatch (rolling PR + @claude enrichment).
  # Automatically every Monday at 08:00 UTC.
  schedule:
    - cron: '0 8 * * 1'

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          # Persist a PAT (not the default GITHUB_TOKEN) so the PR opened below
          # triggers the required CI workflows. PRs opened with GITHUB_TOKEN do
          # NOT trigger other workflows, which would leave required checks
          # unreported and the PR permanently blocked. Fine-grained PAT scoped to
          # this repo with contents:write + pull-requests:write, stored as the
          # SCRAPE_TOKEN secret. Falls back to GITHUB_TOKEN if unset (CI won't
          # run on the PR in that case — see required checks on develop).
          token: ${{ secrets.SCRAPE_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # @christopherstavrou/* deps come from private GitHub Packages — needs a
      # PAT with read:packages stored as the NODE_AUTH_TOKEN repo secret.
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser
        run: npx playwright install chromium

      # Optional Facebook auth (#161). If a SCRAPE_COOKIES secret is present
      # (a Cookie-Editor JSON export), write it to the cookies file so the
      # scraper browses as a logged-in user and can see older/hidden events.
      # Absent → the scraper falls back to guest mode (only currently-public
      # events). The file is gitignored and never committed. FB session cookies
      # expire every few weeks; refresh the secret when the scraper log shows
      # "browsing as guest". Guarded in bash rather than `if:` because the
      # `secrets` context isn't available in step conditions.
      - name: Write Facebook cookies (optional)
        env:
          SCRAPE_COOKIES: ${{ secrets.SCRAPE_COOKIES }}
        run: |
          if [ -n "$SCRAPE_COOKIES" ]; then
            mkdir -p scripts
            # Restrict to owner before writing the credential, so later steps /
            # third-party actions can't read the session cookies off the disk.
            touch scripts/facebook-cookies.json
            chmod 600 scripts/facebook-cookies.json
            printf '%s' "$SCRAPE_COOKIES" > scripts/facebook-cookies.json
            echo "Wrote cookies file ($(wc -c < scripts/facebook-cookies.json) bytes) — scraping authenticated."
          else
            echo "No SCRAPE_COOKIES secret set — scraping as guest (older events may be hidden)."
          fi

      - name: Determine scrape flags
        id: flags
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          if [ "$MODE" = "upcoming" ]; then
            echo "flags=--upcoming" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = "past" ]; then
            echo "flags=--past" >> "$GITHUB_OUTPUT"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run scraper
        run: >
          npx sitekit-scrape-events
          --page-url 'https://www.facebook.com/amioprenovamusic/events'
          --out-dir src/content/shows
          --images-dir public/images/events
          --cookies scripts/facebook-cookies.json
          ${{ steps.flags.outputs.flags }}

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- src/content/shows/ public/images/events/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # develop is branch-protected (PR required, enforced for admins), so the
      # bot cannot push directly. Open a PR from a bot branch instead; a human
      # reviews + merges the event-data diff. (Enable auto-merge here if you'd
      # rather it land unattended.)
      # The PR is opened with SCRAPE_TOKEN (a PAT) so it triggers the required CI
      # checks on develop — the quality gate skips bot/* PRs, CodeQL + the
      # Cloudflare build run and gate the merge like any other PR.
      #
      # Single rolling branch (#152): reset `bot/scrape-events` on top of the
      # freshly-checked-out develop each run and force-push, so there is exactly
      # one open scrape PR. A pending PR is refreshed in place rather than
      # spawning a timestamped duplicate, and it can never go stale against
      # develop. Coordination caveat: a force-push replaces any enrichment
      # commits still sitting unmerged on the branch — review + merge the rolling
      # PR before the next run so curated content isn't dropped (the scraper now
      # honors `_overrides` locks, so already-merged enrichment is safe).
      - name: Open or update the rolling scrape PR
        if: steps.changes.outputs.changed == 'true'
        id: open_pr
        env:
          GH_TOKEN: ${{ secrets.SCRAPE_TOKEN || github.token }}
        run: |
          BRANCH="bot/scrape-events"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/content/shows/ public/images/events/
          git commit -m "chore(events): sync Facebook events"
          git push --force origin "$BRANCH"
          # Reuse the open PR if one exists (rolling), else create it.
          # `// ""` coerces the no-match case to an empty string — without it jq
          # prints the literal "null", which `-z` treats as non-empty and we'd
          # try to comment on PR "null".
          PR_NUMBER=$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[0].number // ""')
          if [ -z "$PR_NUMBER" ]; then
            PR_URL=$(gh pr create --base develop --head "$BRANCH" \
              --title "chore(events): sync Facebook events" \
              --body "Automated Facebook events sync via @christopherstavrou/events-scraper. Rolling PR — refreshed in place each run (#152). Review the event-data diff and merge.")
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # Auto-enrich (#151): ask the Claude agent (via claude.yml, which triggers
      # on @claude mentions) to curate the raw scraped content — translate EN↔BG,
      # fill missing curated fields, set `_overrides` locks, normalise
      # hosts/venue. The comment must come from SCRAPE_TOKEN (a PAT): claude.yml's
      # security gate checks author_association, and a GITHUB_TOKEN comment has no
      # association so it would be silently skipped. The scraper honoring
      # `_overrides` (sitekit#1) is what keeps this enrichment from being wiped on
      # the next scrape.
      - name: Ask Claude to enrich new events
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SCRAPE_TOKEN || github.token }}
        run: |
          gh pr comment ${{ steps.open_pr.outputs.pr_number }} \
            --body "@claude please run the \`enrich-events\` skill on the new/changed \`src/content/shows/\` files in this PR. For each changed file: translate EN fields to English and BG fields to Bulgarian, fill all missing curated fields, set \`_overrides\` locks, and normalise hosts/venue. Refer to \`docs/ai/event-enrichment.md\` for the full field guide."
