name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Security: only repo owners, org members, and invited collaborators can
    # trigger Claude. author_association is set by GitHub from repo permissions,
    # so public users are blocked automatically even if this repo is made public.
    if: |
      (github.event_name == 'issue_comment' &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association) &&
       contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
       (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Resolve checkout ref
        id: ref
        uses: actions/github-script@v7
        with:
          script: |
            // PR-triggered events expose the head SHA directly
            if (context.payload.pull_request) {
              return context.payload.pull_request.head.sha;
            }
            // issue_comment on a PR: payload has issue.pull_request link but not the head SHA
            if (context.payload.issue?.pull_request) {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.issue.number,
              });
              return pr.data.head.sha;
            }
            // issues event or any other trigger: start from develop
            return 'develop';
          result-encoding: string

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.result }}
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Authentication: Claude.ai Pro/Max via OAuth token.
          # Generate with: claude setup-token
          # Store result as repository secret CLAUDE_CODE_OAUTH_TOKEN.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Stable branch name per issue/PR — no timestamp, so repeated runs
          # on the same issue push to the same branch instead of creating new ones.
          branch_name_template: "ai-{{entityType}}-{{entityNumber}}"

          # Tool permissions and turn limit.
          # mcp__github_comment__* tools are granted automatically by the action.
          claude_args: --max-turns 80 --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Agent,TodoWrite
